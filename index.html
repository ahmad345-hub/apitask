<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Store</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item">
        <a class="nav-link" href="#">Home</a>
      </li>
    </ul>
  </div>
</nav>

<section class="hero text-center text-white">
  <div class="container">
    <h1>Best Products Online</h1>
    <p>Shop the best items now</p>
  </div>
</section>

<div class="container my-4">
<div id="categories" class="category-grid mb-4"></div>


  <div class="d-flex justify-content-end mb-3">
    <select id="sort" class="form-select w-auto">
      <option value="">Sort</option>
      <option value="title-asc">Title Asc</option>
      <option value="title-desc">Title Desc</option>
      <option value="price-asc">Price Asc</option>
      <option value="price-desc">Price Desc</option>
    </select>
  </div>

  <div id="products" class="row g-4"></div>

  <div class="d-flex justify-content-center mt-4" id="pagination" style="display: none;">
  <button id="prev" class="btn btn-dark me-2">Prev</button>
  <button id="next" class="btn btn-dark">Next</button>
</div>

</div>

<script src="./js/main.js"></script>
</body>
</html>
